name: Pages Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages configuration
        run: |
          echo "== GET /pages (site configuration) =="
          curl -s -w "\nHTTP %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages"
          echo "== GET /pages/builds/latest =="
          curl -s -w "\nHTTP %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds/latest"
          echo "== POST /pages/builds (request a build) =="
          curl -s -w "\nHTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
