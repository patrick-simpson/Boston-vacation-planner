name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build into docs/
        run: npm run build

      # GitHub Pages serves main:/docs, so the built site is committed back
      # to main whenever the source changed it. Pushes made with GITHUB_TOKEN
      # do not re-trigger this workflow, so this cannot loop.
      - name: Commit built site back to main
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Build site into docs/ [skip ci]"
            git push origin HEAD:main
          else
            echo "docs/ already up to date"
          fi

      # Bot pushes don't always trigger the internal Pages build, so ask for
      # one explicitly. Requires Pages source: Deploy from a branch (main /docs).
      - name: Request Pages build
        run: |
          curl -s -w "\nHTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
