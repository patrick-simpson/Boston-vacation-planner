name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy dist to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true

      # The Pages site was left configured with the "GitHub Actions" source,
      # whose protected github-pages environment rejects our deployments, while
      # branch pushes were silently ignored. Point Pages back at the gh-pages
      # branch (idempotent) and request a build so the pushed content goes live.
      - name: Ensure Pages serves gh-pages and request a build
        run: |
          echo "== Set Pages source to the gh-pages branch =="
          curl -s -w "\nHTTP %{http_code}\n" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}' \
            "https://api.github.com/repos/${{ github.repository }}/pages"
          echo "== Request Pages build =="
          curl -s -w "\nHTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
          echo "== Resulting configuration =="
          curl -s -w "\nHTTP %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages"
